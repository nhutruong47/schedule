<title>Lịch của tôi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Design plan
   Color: slate neutrals with blue accent; activity types use hue-coded fills.
   Type: Manrope display, Be Vietnam Pro body, tabular numerals for times.
   Layout: one-screen shell — header, toolbar, sticky-headed timetable grid. */
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --line:#dfe3e9;
  --slot-line:rgba(120,138,160,.16);
  --fg:#0f1721;
  --fg-2:#4c5765;
  --fg-3:#7c8797;
  --accent:#2b5fa8;
  --accent-ink:#ffffff;
  --shadow:0 1px 2px rgba(15,23,33,.06), 0 10px 28px -14px rgba(15,23,33,.35);
  --font-display:'Manrope','Be Vietnam Pro',system-ui,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --slot-h:30px;
  --gutter:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#161d25; --line:#293442; --slot-line:rgba(140,165,195,.11);
    --fg:#e9eef4; --fg-2:#a8b4c2; --fg-3:#7b8797;
    --accent:#7cabef; --accent-ink:#0b1016;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d25; --line:#293442; --slot-line:rgba(140,165,195,.11);
  --fg:#e9eef4; --fg-2:#a8b4c2; --fg-3:#7b8797;
  --accent:#7cabef; --accent-ink:#0b1016;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.8);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px var(--gutter-r) 12px var(--gutter);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.02em}
.brand h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:1px 0 0;font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:18px;margin-left:auto;padding-right:4px;flex-wrap:wrap}
.stats div{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.stats b{font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--fg-3)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--bad,#b3352c);border-color:color-mix(in srgb,var(--bad,#b3352c) 35%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--bad,#b3352c) 8%,var(--surface))}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px var(--gutter-r) 10px var(--gutter);border-bottom:1px solid var(--line)}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .label{font-weight:600;font-size:12.5px;min-width:170px;text-align:center;font-variant-numeric:tabular-nums}
.weeknav .label small{display:block;font-weight:500;font-size:10px;color:var(--fg-3)}
.seg{display:inline-flex;background:var(--surface-2,#eceff3);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--fg-2)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(15,23,33,.12)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--fg-2);font-variant-numeric:tabular-nums}
.daypick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{display:flex;align-items:center;gap:7px;min-width:0;flex:1 1 180px;max-width:260px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 10px;height:34px}
.search svg{flex:none;color:var(--fg-3)}
.search input{border:0;background:transparent;outline:none;width:100%;font-size:13px;min-width:0}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.chip.bad{background:color-mix(in srgb,#b3352c 12%,transparent);color:#b3352c;border-color:color-mix(in srgb,#b3352c 28%,transparent)}
.workspace{flex:1;min-height:0;display:flex;flex-direction:column}
.boardwrap{flex:1;min-height:0;overflow:auto;padding:0 var(--gutter-r) 32px var(--gutter);overscroll-behavior:contain}
.emptybar{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:#e8eefa;color:var(--fg-2);font-size:12.5px}
.board{display:grid;grid-template-columns:56px repeat(var(--d,7),minmax(0,1fr));align-items:start;padding-bottom:8px}
.corner{grid-column:1;grid-row:1;position:sticky;top:0;left:0;z-index:9;background:var(--bg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);border-bottom:1px solid var(--line)}
.dayhead{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 10px 8px;display:flex;flex-direction:column;gap:1px}
.dayhead .wd{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--fg-2);text-transform:uppercase}
.dayhead .dt{font-size:12px;font-weight:600;color:var(--fg-3);font-variant-numeric:tabular-nums}
.dayhead.today .dt{color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:0 6px;width:max-content}
.dayhead.weekend{background:color-mix(in srgb,#eceff3 50%,var(--bg))}
.timecol{grid-column:1;grid-row:2;position:sticky;left:0;z-index:4;background:var(--bg);border-right:1px solid var(--line)}
.tlabel{position:absolute;right:6px;font-size:10px;color:var(--fg-3);font-variant-numeric:tabular-nums;transform:translateY(-5px)}
.daycol{grid-row:2;border-left:1px solid var(--line);min-width:0}
.daycol.weekend{background:color-mix(in srgb,#eceff3 42%,var(--bg))}
.dbody{position:relative;cursor:pointer}
.dbody{background-image:repeating-linear-gradient(to bottom,var(--slot-line) 0 1px,transparent 1px var(--slot-h))}
.evs{position:absolute;inset:0;pointer-events:none}
.ev{position:absolute;pointer-events:auto;touch-action:none;overflow:hidden;display:flex;flex-direction:column;gap:2px;text-align:left;padding:3px 7px;border-radius:6px;color:var(--fg);cursor:grab;background:color-mix(in srgb,hsl(var(--h,212) 58% 46%) 16%,var(--surface));box-shadow:inset 3px 0 0 hsl(var(--h,212) 55% 45%);font-size:11px}
.ev:hover{box-shadow:inset 3px 0 0 hsl(var(--h,212) 55% 45%),var(--shadow);transform:translateY(-1px);z-index:2}
.ev.selected{outline:2px solid hsl(var(--h,212) 60% 48%);outline-offset:1px}
.ev.dim{opacity:.22}
.ev-t{font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-m{font-size:9.5px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:0;right:0;height:2px;background:#b3352c;z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#b3352c}
.scrim{position:fixed;inset:0;background:rgba(14,20,28,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,90vw);z-index:60;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .24s cubic-bezier(.3,.8,.3,1);box-shadow:var(--shadow);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-3)}
.drawer-body{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.dw-title{display:flex;gap:10px;align-items:flex-start}
.huebar{width:5px;border-radius:3px;background:hsl(var(--h,212) 55% 45%);align-self:stretch;flex:none}
.dw-title h2{margin:0;font-family:var(--font-display);font-size:16px;font-weight:700;line-height:1.25}
.dw-sub{margin:2px 0 0;font-size:11.5px;color:var(--fg-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13px;margin:0}
.kv dt{color:var(--fg-3);font-size:12px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.dw-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(14,20,28,.4);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{width:100%;max-width:500px;background:var(--surface);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.dialog h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.dialog p.lead{margin:-6px 0 0;font-size:12px;color:var(--fg-3)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-2);min-width:0}
.field>span{font-weight:600;font-size:11.5px;letter-spacing:.02em}
.field input,.field select{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:13px;outline:none;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.hint{font-size:11.5px;color:var(--fg-3)}
.hint.warn{color:#946209;font-weight:500}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.dialog-actions .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(16px+env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--fg);color:var(--bg);border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:500;z-index:90;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:var(--shadow);max-width:calc(100vw-32px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
@media (max-width:760px){.board{min-width:min(640px,100vw);--slot-h:26px}.topbar{padding-top:10px}.stats{gap:14px;margin-left:0;order:3;width:100%}.top-actions{margin-left:auto}.search{max-width:none;order:5;flex-basis:100%}.weeknav .label{min-width:0;font-size:12px}.dayhead{padding:7px 8px}.ev-t{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">L</div>
      <div style="min-width:0">
        <h1 id="appTitle">Lịch của tôi</h1>
        <p id="semLabel">Tuần · --/--</p>
      </div>
    </div>
    <div class="stats" aria-label="Tổng quan tuần">
      <div><b id="stEvents">0</b><span>hoạt động</span></div>
      <div><b id="stHours">0</b><span>giờ</span></div>
    </div>
    <div class="top-actions">
      <button class="btn sm" id="btnSettings">Cài đặt</button>
      <button class="btn primary sm" id="btnAdd">+ Thêm</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="weeknav">
      <button class="btn icon" id="prevWk" style="padding:0;width:32px;height:32px;font-size:16px;line-height:1">‹</button>
      <button class="btn sm" id="btnToday" style="border:0;background:transparent">Hôm nay</button>
      <div class="label" id="weekLabel">Tuần 1<small>01/01 – 07/01</small></div>
      <button class="btn icon" id="nextWk" style="padding:0;width:32px;height:32px;font-size:16px;line-height:1">›</button>
    </div>
    <div class="seg" role="group" aria-label="Xem">
      <button data-view="week" class="on">Tuần</button><button data-view="day">Ngày</button>
    </div>
    <div class="daypick" id="dayPick" hidden></div>
    <label class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Tìm hoạt động" aria-label="Tìm"></label>
    <button class="chip" id="btnAgenda">Danh sách tuần</button>
    <div class="spacer"></div>
    <button class="chip bad" id="btnConflicts" hidden></button>
  </div>

  <main class="workspace">
    <div class="boardwrap" id="boardwrap"><div class="board" id="board"></div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Chi tiết">
  <div class="drawer-head">
    <span class="eyebrow" id="dwEyebrow">Chi tiết</span>
    <button class="btn icon" id="dwClose" style="padding:0;width:32px;height:32px;font-size:16px;line-height:1">✕</button>
  </div>
  <div class="drawer-body" id="dwBody"></div>
</aside>

<div class="modal" id="editor" hidden>
  <form class="dialog" id="editorForm" novalidate>
    <h2 id="edTitle">Thêm hoạt động</h2>
    <p class="lead">Lưu trên trình duyệt của bạn.</p>
    <label class="field"><span>Tên hoạt động</span><input id="edName" maxlength="60" placeholder="VD: Họp nhóm dự án" required></label>
    <label class="field"><span>Loại</span><select id="edCat"></select></label>
    <div class="field"><span>Màu</span><div class="swatches" id="edSwatches"></div></div>
    <div class="form-row">
      <label class="field"><span>Thứ</span><select id="edDay"></select></label>
      <label class="field"><span>Bắt đầu</span><input type="time" id="edStart" step="300"></label>
      <label class="field"><span>Kết thúc</span><input type="time" id="edEnd" step="300"></label>
    </div>
    <div class="form-row">
      <label class="field"><span>Địa điểm</span><input id="edPlace" maxlength="40" placeholder="Không bắt buộc"></label>
      <label class="field"><span>Ghi chú</span><input id="edNote" maxlength="60" placeholder="Không bắt buộc"></label>
    </div>
    <div class="hint" id="edHint">Tuần đang xem</div>
    <div class="hint warn" id="edWarn" hidden></div>
    <div class="dialog-actions">
      <button type="button" class="btn danger" id="edDelete" hidden>Xóa</button>
      <span class="left"></span>
      <button type="button" class="btn" id="edCancel">Hủy</button>
      <button type="submit" class="btn primary" id="edSave">Lưu</button>
    </div>
  </form>
</div>

<div class="modal" id="settings" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Cài đặt</h2>
    <p class="lead">Dữ liệu nằm trên trình duyệt này, không gửi đi đâu khác.</p>
    <label class="field"><span>Tên lịch</span><input id="setTitle" maxlength="40"></label>
    <div class="form-row">
      <label class="field"><span>Bắt đầu hiển thị</span><select id="setStart"></select></label>
      <label class="field"><span>Kết thúc hiển thị</span><select id="setEnd"></select></label>
    </div>
    <div class="field"><span>Hiển thị</span><select id="setWeekend"><option value="1">Thứ Hai–Chủ Nhật</option><option value="0">Thứ Hai–Thứ Sáu</option></select></div>
    <div class="dialog-actions">
      <button type="button" class="btn danger" id="btnReset">Xóa toàn bộ dữ liệu</button>
      <span class="left"></span>
      <button type="button" class="btn" id="setCancel">Đóng</button>
      <button type="button" class="btn primary" id="setSave">Lưu</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const KEY='tkb.v3';
  const DAYS=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
  const HUES=[212,152,28,348,188,266,96,8];
  const SLOT=30;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad=n=>String(n).padStart(2,'0');
  const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parseYMD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
  const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
  const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7));};
  const dm=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
  const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7);};
  const toMin=t=>{const p=String(t).split(':').map(Number);return p[0]*60+(p[1]||0);};
  const hhmm=m=>{m=Math.max(0,Math.min(1440,Math.round(m)));return pad(Math.floor(m/60))+':'+pad(m%60);};
  const durText=m=>{const h=Math.floor(m/60),mm=m%60;return h&&mm?h+'g'+mm+'p':h?h+'g':mm+'p'};

  function uid(p){return (p||'e')+'-'+Math.random().toString(36).slice(2,8);}
  function defaultState(){
    const ws=ymd(mondayOf(new Date()));
    const cats=[{id:'ct-work',name:'Làm việc',hue:212},{id:'ct-study',name:'Học tập',hue:266},{id:'ct-sport',name:'Thể thao',hue:28},{id:'ct-family',name:'Gia đình',hue:348},{id:'ct-fun',name:'Giải trí',hue:152},{id:'ct-travel',name:'Du lịch',hue:188}];
    const ev=(cat,day,title,start,end)=>({id:uid('ev'),catId:cat,day,title,start,end,place:'',note:'',weekStart:ws,weeks:1});
    return {appTitle:'Lịch của tôi',startHour:6,endHour:22,showWeekend:true,weekStart:ws,view:'week',dayIndex:0,cats,events:[
      ev('ct-sport',0,'Chạy bộ','06:30','07:15'),

  $('dwBody').addEventListener('click',e=>{const ag=e.target.closest('[data-agenda]');if(ag){openEvent(ag.dataset.agenda);return;}const act=e.target.closest('[data-act]');if(!act||!selectedId)return;const ev=state.events.find(x=>x.id===selectedId);if(!ev)return;const a=act.dataset.act;if(a==='edit'){closeDrawer();openEditor({id:selectedId});}else if(a==='delete')deleteEvent(selectedId);else if(a==='next'){state.events.push(Object.assign({},ev,{id:uid('ev'),weekStart:ymd(addDays(parseYMD(ev.weekStart),7)),weeks:1}));save();render();toast('Đã thêm sang tuần sau');}});
  $('dwClose').onclick=closeDrawer;$('scrim').onclick=closeDrawer;
  document.querySelectorAll('.seg button').forEach(btn=>btn.onclick=function(){state.view=this.dataset.view;save();render();});
  $('dayPick').onclick=e=>{const b=e.target.closest('[data-day]');if(b){state.dayIndex=+b.dataset.day;save();render();}};
  $('prevWk').onclick=()=>{state.weekStart=ymd(addDays(weekMonday(),-7));save();render();};
  $('nextWk').onclick=()=>{state.weekStart=ymd(addDays(weekMonday(),7));save();render();};
  $('btnToday').onclick=()=>{const now=new Date();state.weekStart=ymd(mondayOf(now));state.dayIndex=(now.getDay()+6)%7;save();render();};
  $('btnAdd').onclick=()=>openEditor({});$('btnSettings').onclick=openSettings;$('btnAgenda').onclick=()=>{renderAgendaDrawer();openDrawer();};$('btnConflicts').onclick=()=>{renderConflictsDrawer();openDrawer();};$('q').oninput=applySearch;
  $('edCat').onchange=function(){
    const row=$('newCatRow');
    if(this.value==='__new'){if(!row)insertNewCat();else row.hidden=false;}
    else if(row)row.hidden=true;
  };
  function insertNewCat(){const row=document.createElement('div');row.id='newCatRow';row.style.cssText='display:flex;flex-direction:column;gap:10px';row.innerHTML='<label class="field"><span>Tên loại mới</span><input id="edNewCat" maxlength="30" placeholder="VD: Sức khỏe, Việc nhà" autocomplete="off"></label><label class="field"><span>Màu</span><div class="swatches" id="edSwatches"></div></label>';$('editorForm').insertBefore(row,$('edHint'));renderSwatches();}
  $('edSwatches').onclick=e=>{const b=e.target.closest('[data-hue]');if(b){editHue=+b.dataset.hue;renderSwatches();}};
  $('editorForm').onsubmit=submitEditor;$('edCancel').onclick=closeEditor;$('edDelete').onclick=function(){if(!editingId)return;const id=editingId;closeEditor();deleteEvent(id);};
  $('setCancel').onclick=()=>{$('settings').hidden=true;};$('setSave').onclick=saveSettings;$('btnReset').onclick=function(){const btn=this;if(btn.dataset.armed==='1'){resetAll();btn.dataset.armed='';return;}btn.dataset.armed='1';btn.textContent='Bấm lần nữa để xóa hết';setTimeout(()=>{btn.dataset.armed='';btn.textContent='Xóa toàn bộ dữ liệu';},4000);};
  let rt=null;window.onresize=()=>{clearTimeout(rt);rt=setTimeout(render,150);};
  document.onkeydown=e=>{if(e.key==='Escape'){if(!$('editor').hidden){closeEditor();return;}if(!$('settings').hidden){$('settings').hidden=true;return;}closeDrawer();}};
  render();
})();
</script>
